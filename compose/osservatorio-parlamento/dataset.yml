# Osservatorio Parlamento — KPI istituzionali per legislatura/anno
root: "../../out"
schema_version: 1

dataset:
  name: "osservatorio_parlamento"
  source_id: "dataciviclab_composite"
  tags: [politica, osservatorio, kpi, parlamento, benchmark]
  category: politica
  years: [2026]
  time_coverage:
    # produione ddl/gruppi: XIX leg.; votazioni/rappresentanza: dove coperto
    start_year: 2022
    end_year: 2026

support:
  - type: dataset
    name: senato_ddl
    config: ../../datasets/senato-ddl/dataset.yml
    years: [2026]
  - type: dataset
    name: camera_voti
    config: ../../datasets/camera-voti/dataset.yml
    years: [2026]
  - type: dataset
    name: senato_votazioni
    config: ../../datasets/senato-votazioni/dataset.yml
    years: [2026]
  - type: dataset
    name: senato_gruppi
    config: ../../datasets/senato-gruppi/dataset.yml
    years: [2026]
  - type: dataset
    name: camera_deputati
    config: ../../datasets/camera-deputati-legislature/dataset.yml
    years: [2026]
  - type: dataset
    name: decreti_legge
    config: ../../compose/decreti-legge/dataset.yml
    years: [2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  validate:
    min_rows: 30

mart:
  tables:
    - name: "mart_kpi"
      sql: "sql/mart_kpi.sql"
  required_tables:
    - "mart_kpi"
  validate:
    table_rules:
      mart_kpi:
        required_columns: [periodo, dimensione, kpi, valore, fonte]
        min_rows: 20

validation:
  fail_on_error: true
