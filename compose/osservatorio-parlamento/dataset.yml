# Osservatorio Parlamento — KPI istituzionali per legislatura/anno
root: "../../out"
schema_version: 1

dataset:
  name: "osservatorio_parlamento"
  source_id: "dataciviclab_composite"
  tags: [politica, osservatorio, kpi, parlamento, benchmark]
  category: politica
  years: [2026]
  time_coverage:
    # produione ddl/gruppi: XIX leg.; votazioni/rappresentanza: dove coperto
    start_year: 2022
    end_year: 2026

# raw: gli input del compose (i parquet dei support). Con raw.sources il
# compose gira con `toolkit run` full come qualsiasi dataset — niente
# clean+mart separato. I support restano per i placeholder {support.*}
# (anti-drift); `toolkit run` li materializza una volta (skip-if-exists).
raw:
  output_policy: "overwrite"
  sources:
    - name: "senato_ddl"
      type: "local_file"
      args:
        path: "../../out/data/clean/senato_ddl/2026/senato_ddl_2026_clean.parquet"
        filename: "senato_ddl.parquet"
      primary: true
    - name: "camera_voti"
      type: "local_file"
      args:
        path: "../../out/data/clean/camera_voti/2026/camera_voti_2026_clean.parquet"
        filename: "camera_voti.parquet"
    - name: "senato_votazioni"
      type: "local_file"
      args:
        path: "../../out/data/clean/senato_votazioni/2026/senato_votazioni_2026_clean.parquet"
        filename: "senato_votazioni.parquet"
    - name: "senato_gruppi"
      type: "local_file"
      args:
        path: "../../out/data/clean/senato_gruppi/2026/senato_gruppi_2026_clean.parquet"
        filename: "senato_gruppi.parquet"
    - name: "camera_deputati"
      type: "local_file"
      args:
        path: "../../out/data/clean/camera_deputati_legislature/2026/camera_deputati_legislature_2026_clean.parquet"
        filename: "camera_deputati.parquet"
    - name: "decreti_legge"
      type: "local_file"
      args:
        path: "../../out/data/clean/decreti_legge/2026/decreti_legge_2026_clean.parquet"
        filename: "decreti_legge.parquet"

support:
  - type: dataset
    name: senato_ddl
    config: ../../datasets/senato-ddl/dataset.yml
    years: [2026]
  - type: dataset
    name: camera_voti
    config: ../../datasets/camera-voti/dataset.yml
    years: [2026]
  - type: dataset
    name: senato_votazioni
    config: ../../datasets/senato-votazioni/dataset.yml
    years: [2026]
  - type: dataset
    name: senato_gruppi
    config: ../../datasets/senato-gruppi/dataset.yml
    years: [2026]
  - type: dataset
    name: camera_deputati
    config: ../../datasets/camera-deputati-legislature/dataset.yml
    years: [2026]
  - type: dataset
    name: decreti_legge
    config: ../../compose/decreti-legge/dataset.yml
    years: [2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  validate:
    min_rows: 30

mart:
  tables:
    - name: "mart_kpi"
      sql: "sql/mart_kpi.sql"
  required_tables:
    - "mart_kpi"
  validate:
    table_rules:
      mart_kpi:
        required_columns: [periodo, dimensione, kpi, valore, fonte]
        min_rows: 20

validation:
  fail_on_error: true
