# Osservatorio Parlamento — KPI istituzionali.
# raw + support da GCS. Produzione/ddl multi-leg (13–19); voti ancora XIX.
root: "../../out"
schema_version: 1

dataset:
  name: "osservatorio_parlamento"
  source_id: "dataciviclab_composite"
  tags: [politica, osservatorio, kpi, parlamento, benchmark]
  category: politica
  years: [2026]
  time_coverage:
    # Produzione legislativa e gruppi: Leg13–19; votazioni/rappresentanza: XIX
    start_year: 1996
    end_year: 2026

raw:
  output_policy: "overwrite"
  sources:
    - name: "senato_ddl"
      type: "http_file"
      args:
        url: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_ddl/19/senato_ddl_19_clean.parquet"
        filename: "senato_ddl.parquet"
      primary: true

support:
  - type: external
    name: senato_ddl_multi
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_ddl/{year}/senato_ddl_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  - type: external
    name: camera_voti
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_voti/{year}/camera_voti_{year}_clean.parquet"
    years: [2026]
  - type: external
    name: senato_votazioni
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_votazioni/{year}/senato_votazioni_{year}_clean.parquet"
    years: [2026]
  - type: external
    name: senato_gruppi
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_gruppi/{year}/senato_gruppi_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  - type: external
    name: camera_deputati
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_deputati_legislature/{year}/camera_deputati_legislature_{year}_clean.parquet"
    years: [2026]
  - type: external
    name: decreti_legge
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/decreti_legge/{year}/decreti_legge_{year}_clean.parquet"
    years: [2026]
  - type: external
    name: camera_votazioni_sparql
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_votazioni_sparql/{year}/camera_votazioni_sparql_{year}_clean.parquet"
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  validate:
    min_rows: 30

mart:
  tables:
    - name: "mart_kpi"
      sql: "sql/mart_kpi.sql"
  required_tables:
    - "mart_kpi"
  validate:
    table_rules:
      mart_kpi:
        required_columns: [periodo, dimensione, kpi, valore, fonte]
        min_rows: 20

validation:
  fail_on_error: true
