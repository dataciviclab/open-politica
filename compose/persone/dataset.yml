# Persone — dimensione persona × legislatura × ramo (Repubblica Leg13-19).
#
# Livello di integrazione, non prodotto: risponde a "chi è questa persona"
# con una chiave stabile e i suoi attributi anagrafici. Le metriche (voti,
# presenze, coerenza di gruppo) restano nel prodotto `osservatorio`.
#
# Perché esiste: il grafo e la dashboard ricostruivano l'identità in tre punti
# (`nodes_senatori`, `nodes_senatore_anagrafica`, `nodes_deputato`) e la
# scheda profilo in un quarto, ognuno con la sua dedup.
root: "../../out"
schema_version: 1

dataset:
  name: "persone"
  source_id: "dataciviclab_composite"
  tags: [politica, parlamento, persone, anagrafica, dimensione]
  category: politica
  years: [2026]
  description: >
    Dimensione persona del Parlamento: una riga per persona × legislatura ×
    ramo, con chiave stabile (`persona_key`), anagrafica (nome, nascita,
    gender), il ponte Camera↔Senato e la provenienza dei dati. Perimetro:
    Repubblica Leg13-19, lo stesso delle relazioni del grafo.
  time_coverage:
    start_year: 1996
    end_year: 2026

raw:
  output_policy: "overwrite"
  sources:
    - name: "senato_anagrafica"
      type: "http_file"
      primary: true
      args:
        url: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_anagrafica/19/senato_anagrafica_19_clean.parquet"
        filename: "senato_anagrafica.parquet"

support:
  # Pattern C: path per LEGISLATURA (…/19/), non anno calendario
  - type: external
    name: senato_anagrafica
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_anagrafica/{year}/senato_anagrafica_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  # Persone viste in aula: copre 110 senatori che l'anagrafica non ha (Leg17-19)
  - type: external
    name: senato_dibattito
    repo: senato-akn
    slug: senato_dibattito
    layer: clean
    years: [2026]
  # Anagrafica Camera: contiene Regno + Repubblica (1-19) — qui si filtra
  # repubblica 13-19 (vedi clean.sql)
  - type: external
    name: camera_deputati
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_deputati_legislature/2026/camera_deputati_legislature_2026_clean.parquet"
    years: [2026]
  # Firmatari: persone con un atto ma senza riga in anagrafica (es. Renzi)
  - type: external
    name: camera_firmatari
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_firmatari/{year}/camera_firmatari_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  # Ponte Camera↔Senato: senatore_id → persona_id (Camera)
  - type: external
    name: ponte_persona
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/ponte_persona/2026/ponte_persona_2026_clean.parquet"
    years: [2026]

  # ── metriche di `mart_profilo` (scheda XIX) ─────────────────────────
  - type: external
    name: senato_votazioni
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_votazioni/2026/senato_votazioni_2026_clean.parquet"
    years: [2026]
  - type: external
    name: senato_gruppi
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_gruppi/{year}/senato_gruppi_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  - type: external
    name: senato_commissioni
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_commissioni/{year}/senato_commissioni_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  - type: external
    name: senato_interventi
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_interventi/{year}/senato_interventi_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  - type: external
    name: camera_commissioni
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_commissioni/{year}/camera_commissioni_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  - type: external
    name: camera_relatori
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_relatori/{year}/camera_relatori_{year}_clean.parquet"
    years: [16, 17, 18, 19]
  - type: external
    name: camera_voti
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_voti/2026/camera_voti_2026_clean.parquet"
    years: [2026]
  - type: external
    name: camera_interventi
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_interventi/2026/camera_interventi_2026_clean.parquet"
    years: [2026]
  - type: external
    name: camera_votazioni_sparql
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_votazioni_sparql/{year}/camera_votazioni_sparql_{year}_clean.parquet"
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
  - type: external
    name: membri_governo
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/membri_governo/2026/membri_governo_2026_clean.parquet"
    years: [2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  required_columns:
    - persona_key
    - ramo
    - sistema
    - legislatura
    - persona_id
    - senatore_id
    - nome
    - cognome
    - nome_completo
    - gender
    - data_nascita
    - luogo_nascita
    - fonte
    - ponte
  validate:
    not_null: [persona_key, ramo, sistema, legislatura]
    primary_key: [persona_key, ramo, sistema, legislatura]
    # ~6.700 righe: Camera 13-19 (4.377) + Senato 13-19 (2.246) + chi manca
    min_rows: 5000

mart:
  tables:
    - name: "mart_persone"
      sql: "sql/mart_persone.sql"
    # scheda XIX: metriche per persona. Legge mart_persone (stessa sessione).
    - name: "mart_profilo"
      sql: "sql/mart_profilo.sql"
  required_tables:
    - "mart_persone"
    - "mart_profilo"
  validate:
    table_rules:
      mart_persone:
        required_columns: [persona_key, ramo, legislatura, nome_completo, ponte]
        primary_key: [persona_key, ramo, sistema, legislatura]
        min_rows: 5000
      mart_profilo:
        required_columns: [ramo, id_parlamentare, nome, cognome, n_voti, pct_col_gruppo]
        primary_key: [ramo, id_parlamentare]
        min_rows: 500

validation:
  fail_on_error: true
