# Elezioni voto — raw + support da GCS (http_file / external).
root: "../../out"
schema_version: 1

dataset:
  name: "elezioni_voto"
  source_id: "dataciviclab_composite"
  tags: [politica, elezioni, voto]
  category: politica
  years: [2026]
  time_coverage:
    mode: full_series
    start_year: 1979
    end_year: 2024

support:
  - type: external
    name: elezioni_comunali
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/elezioni_comunali/{year}/elezioni_comunali_{year}_clean.parquet"
    years: [2016, 2017, 2018, 2019, 2020, 2021, 2024]
  - type: external
    name: elezioni_europee
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/elezioni_europee/{year}/elezioni_europee_{year}_clean.parquet"
    years: [1979, 1984, 1989, 1994, 1999, 2004, 2009, 2014, 2019, 2024]
  - type: external
    name: elezioni_regionali
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/elezioni_regionali/{year}/elezioni_regionali_{year}_clean.parquet"
    years: [2018, 2019, 2020, 2021, 2023, 2024]

raw:
  output_policy: overwrite
  sources:
    - name: "elezioni_comunali"
      type: "http_file"
      args:
        url: "https://storage.googleapis.com/dataciviclab-clean/open-politica/elezioni_comunali/2024/elezioni_comunali_2024_clean.parquet"
        filename: "elezioni_comunali.parquet"
      primary: true

clean:
  sql: "sql/clean.sql"
  read:
    source: "auto"
    mode: "latest"
  validate:
    min_rows: 10000
    promotion:
      max_row_drop_pct: 100

mart:
  tables:
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_trend"
      sql: "sql/mart_trend.sql"
    - name: "mart_liste"
      sql: "sql/mart_liste.sql"
  validate:
    table_rules:
      mart_sintesi: { min_rows: 100 }
      mart_trend: { min_rows: 10 }
      mart_liste: { min_rows: 100 }

validation:
  fail_on_error: true
