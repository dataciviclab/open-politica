# Profilo politico — scheda viva del parlamentare (XIX).
# raw + support da GCS (http_file / external) — non rilancia i dataset sorgente.
# Support multi-leg Pattern C letti da GCS; l'output resta XIX (voti Leg19).
root: "../../out"
schema_version: 1

dataset:
  name: "profilo_politico"
  source_id: "dataciviclab_composite"
  tags: [politica, profilo, senato, voti, accountability]
  category: politica
  years: [2026]
  time_coverage:
    # Output XIX; support multi-leg da GCS (membership storica)
    start_year: 2022
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    - name: "senato_votazioni"
      type: "http_file"
      primary: true
      args:
        url: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_votazioni/2026/senato_votazioni_2026_clean.parquet"
        filename: "senato_votazioni.parquet"

support:
  # Pattern C multi-leg (GCS 13–19; relatori solo 16–19)
  - type: external
    name: senato_anagrafica
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_anagrafica/{year}/senato_anagrafica_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  - type: external
    name: senato_gruppi
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_gruppi/{year}/senato_gruppi_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  - type: external
    name: senato_commissioni
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_commissioni/{year}/senato_commissioni_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  - type: external
    name: senato_interventi
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_interventi/{year}/senato_interventi_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  - type: external
    name: camera_commissioni
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_commissioni/{year}/camera_commissioni_{year}_clean.parquet"
    years: [13, 14, 15, 16, 17, 18, 19]
  - type: external
    name: camera_relatori
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_relatori/{year}/camera_relatori_{year}_clean.parquet"
    years: [16, 17, 18, 19]
  # Ancora single-year su GCS (path …/2026/)
  - type: external
    name: ponte_persona
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/ponte_persona/{year}/ponte_persona_{year}_clean.parquet"
    years: [2026]
  - type: external
    name: membri_governo
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/membri_governo/{year}/membri_governo_{year}_clean.parquet"
    years: [2026]
  - type: external
    name: camera_voti
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_voti/{year}/camera_voti_{year}_clean.parquet"
    years: [2026]
  - type: external
    name: camera_deputati
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_deputati_legislature/{year}/camera_deputati_legislature_{year}_clean.parquet"
    years: [2026]
  - type: external
    name: camera_interventi
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_interventi/{year}/camera_interventi_{year}_clean.parquet"
    years: [2026]
  - type: external
    name: senato_votazioni_support
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_votazioni/{year}/senato_votazioni_{year}_clean.parquet"
    years: [2026]
  - type: external
    name: camera_votazioni_sparql
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/camera_votazioni_sparql/{year}/camera_votazioni_sparql_{year}_clean.parquet"
    years: [2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: config_only
    mode: latest
  validate:
    min_rows: 100

mart:
  tables:
    - name: "mart_profilo"
      sql: "sql/mart_profilo_senatore.sql"
  required_tables:
    - "mart_profilo"
  validate:
    table_rules:
      mart_profilo:
        required_columns: [ramo, id_parlamentare, persona_id, nome, n_voti, pct_coerente, pct_col_gruppo]
        primary_key: [ramo, id_parlamentare]
        min_rows: 400

validation:
  fail_on_error: true
