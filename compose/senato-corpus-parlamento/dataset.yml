# Senato Corpus Parlamento — corpus Akoma Ntoso × senato_ddl.
# raw + support da GCS — non rilancia i dataset sorgente.
# Corpus senato-akn è XIX (2026): il join iter resta su Leg19.
root: "../../out"
schema_version: 1

dataset:
  name: "senato_corpus_parlamento"
  source_id: "dataciviclab_composite"
  tags: [politica, senato, corpus, iter, peso-documentale]
  category: politica
  years: [2026]
  time_coverage:
    start_year: 2022
    end_year: 2026

raw:
  output_policy: "overwrite"
  sources:
    - name: "senato_corpus"
      type: "http_file"
      args:
        url: "https://storage.googleapis.com/dataciviclab-clean/senato-akn/senato_corpus/2026/senato_corpus_2026_clean.parquet"
        filename: "senato_corpus.parquet"
      primary: true

support:
  - type: external
    name: senato_ddl
    uri: "https://storage.googleapis.com/dataciviclab-clean/open-politica/senato_ddl/{year}/senato_ddl_{year}_clean.parquet"
    years: [19]
  - type: external
    name: senato_corpus
    uri: "https://storage.googleapis.com/dataciviclab-clean/senato-akn/senato_corpus/{year}/senato_corpus_{year}_clean.parquet"
    years: [2026]
  - type: external
    name: senato_emendamenti
    uri: "https://storage.googleapis.com/dataciviclab-mart/senato-akn/senato_emendamenti/{year}/mart_emendamenti_per_atto.parquet"
    years: [2026]

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns: [atto_num, stato, natura, famiglie, testo_totale, articoli_totali]
  validate:
    transition:
      warn_removed_columns: false
    not_null: [atto_num]
    min_rows: 1000

mart:
  tables:
    - name: "mart_atto_corpus"
      sql: "sql/mart_atto_corpus.sql"
    - name: "mart_decreti_peso"
      sql: "sql/mart_decreti_peso.sql"
    - name: "mart_intensita_emendativa"
      sql: "sql/mart_intensita_emendativa.sql"
  required_tables:
    - "mart_atto_corpus"
  validate:
    table_rules:
      mart_atto_corpus:
        required_columns: [atto_num, stato, famiglie, testo_totale]
        primary_key: [atto_num]
        min_rows: 1000
      mart_decreti_peso:
        required_columns: [atto_num, fase, esito, testo_totale]
        min_rows: 10
      mart_intensita_emendativa:
        required_columns: [atto_num, fase, n_emend, testo_emendamenti]
        min_rows: 1000

validation:
  fail_on_error: true
