# Relatori della Camera — i "registi" delle leggi (Leg13–19)
root: "../../out"
schema_version: 1

dataset:
  name: "camera_relatori"
  source_id: "dati_camera"
  tags: [politica, camera, relatori, iter, produzione]
  category: politica
  # LOD Camera espone ocd:relatore solo da Leg16 (rel13/14/15 = 0 live 2026-10-02)
  years: [16, 17, 18, 19]
  time_coverage:
    # Leg XVI–XIX — ocd:relatore, filtro URI rel{year}_
    start_year: 2008
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    # Source 1 (primary): incarichi via discussione (chi-quando, data/tipo)
    - name: "camera_relatori_sparql"
      type: "sparql"
      primary: true
      args:
        endpoint: "https://dati.camera.it/sparql"
        # Leg19 ~10k > cap 10k → pages=2; legislature storiche sotto il cap
        pages: 2
        step: 10000
        query: |
          PREFIX ocd: <http://dati.camera.it/ocd/>
          SELECT ?rel (MAX(?dep) AS ?dep) (MAX(?data) AS ?data) (MAX(?tipo) AS ?tipo)
          WHERE {
            ?rel a ocd:relatore ; ocd:rif_deputato ?dep .
            ?disc ocd:rif_relatore ?rel ; <http://purl.org/dc/elements/1.1/date> ?data .
            OPTIONAL { ?rel <http://purl.org/dc/elements/1.1/type> ?tipo . }
            FILTER(CONTAINS(STR(?rel), "rel{year}_"))
          }
          GROUP BY ?rel
        accept_format: "sparql-results+json"
    # Source 2 (#62): chiave atto diretta ocd:atto ocd:rif_relatore
    # ~45% degli incarichi Leg19; il resto resta senza atto pulito.
    # NOTA: ocd:rif_deputato è sul relatore, non sull'atto (0 results se
    # richiesto su ?atto). Il deputato resta dalla source 1 (join su rel).
    - name: "camera_relatori_atto_sparql"
      type: "sparql"
      args:
        endpoint: "https://dati.camera.it/sparql"
        pages: 2
        step: 10000
        query: |
          PREFIX ocd: <http://dati.camera.it/ocd/>
          SELECT ?rel (MAX(?atto) AS ?atto)
          WHERE {
            ?atto a ocd:atto ; ocd:rif_relatore ?rel .
            FILTER(CONTAINS(STR(?rel), "rel{year}_"))
          }
          GROUP BY ?rel
        accept_format: "sparql-results+json"

clean:
  sql: "sql/clean.sql"
  read_mode: robust
  required_columns: [relatore_id, deputato_id, data, atto_camera, atto_id, atto_legislatura]
  read:
    source: auto
    # union_by_name delle 2 sorgenti SPARQL (discussione + atto diretto)
    mode: all
    header: true
    encoding: "utf-8"
    strict_mode: false
    ignore_errors: true
    trim_whitespace: true
  validate:
    not_null: [relatore_id, deputato_id]
    primary_key: [relatore_id]
    # per-leg: Leg19 ~10k; storiche sotto
    min_rows: 1000

mart:
  tables:
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_top_relatori"
      sql: "sql/mart_top_relatori.sql"
  required_tables:
    - "mart_sintesi"
  validate:
    table_rules:
      mart_sintesi:
        required_columns: [anno, n_relatori]
        primary_key: [anno]
        min_rows: 1
      mart_top_relatori:
        required_columns: [deputato_id, n_incarichi]
        primary_key: [deputato_id]
        min_rows: 50

validation:
  fail_on_error: true
