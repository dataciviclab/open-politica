# Firmatari degli atti di indirizzo e controllo della Camera (Leg13–19)
#
# Fonte: dati.camera.it SPARQL, classe ocd:aic.
# Una riga = (atto, firmatario, ruolo). Il ruolo è "primo" o "altro".
# Join: atto_id → camera_sindisp.atto_id; persona_id → camera_deputati.persona_id.
#
# Paginazione keyset su una chiave sintetica (atto|firmatario|ruolo):
# ?atto da solo non è una chiave monotona per pagina (un atto ha più firmatari).

root: "../../out"
schema_version: 1

dataset:
  name: "camera_sindisp_firmatari"
  source_id: "dati_camera"
  tags: [politica, camera, sindacato-ispettivo, firmatari, accountability]
  category: politica
  years: [13, 14, 15, 16, 17, 18, 19]
  time_coverage:
    start_year: 1996
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    # Keyset dichiarativo su chiave sintetica (atto|firmatario|ruolo):
    # ?atto da solo non è monotono per pagina (più firmatari per atto).
    # {keyset} isola il FILTER nella sottoquery (bug ottimizzatore Virtuoso
    # su FILTER + OPTIONAL nella stessa WHERE). {year} = legislatura.
    - name: "camera_sindisp_firmatari_raw"
      type: "sparql"
      primary: true
      client:
        timeout: 600
      args:
        endpoint: "https://dati.camera.it/sparql"
        accept_format: "sparql-results+json"
        query: |
          PREFIX ocd: <http://dati.camera.it/ocd/>
          PREFIX dc: <http://purl.org/dc/elements/1.1/>
          PREFIX rdfs: <http://www.w3.org/2000/01/rdf-schema#>
          SELECT ?key ?atto ?firm ?ruolo ?label
          WHERE {
            {
              SELECT DISTINCT ?key ?atto ?firm ?ruolo WHERE {
                {
                  ?atto a ocd:aic ;
                        ocd:primo_firmatario ?firm ;
                        ocd:rif_leg <http://dati.camera.it/ocd/legislatura.rdf/repubblica_{year}> .
                  BIND("primo" AS ?ruolo)
                }
                UNION
                {
                  ?atto a ocd:aic ;
                        ocd:altro_firmatario ?firm ;
                        ocd:rif_leg <http://dati.camera.it/ocd/legislatura.rdf/repubblica_{year}> .
                  BIND("altro" AS ?ruolo)
                }
                FILTER(!STRENDS(STR(?atto), "_S"))
                BIND(CONCAT(STR(?atto), "|", STR(?firm), "|", ?ruolo) AS ?key)
                {keyset}
              }
              ORDER BY ?key
              LIMIT 10000
            }
            OPTIONAL { ?firm rdfs:label ?label }
          }
          ORDER BY ?key
          LIMIT 10000
        pages: 1000
        step: 10000
        pagination:
          mode: keyset
          key: "?key"
          key_column: "key"
          key_literal: "string"

clean:
  sql: "sql/clean.sql"
  read_mode: robust
  required_columns: [atto_id, firmatario_uri, ruolo, legislatura]
  read:
    source: auto
    mode: latest
    header: true
    encoding: "utf-8"
    strict_mode: false
    ignore_errors: true
    trim_whitespace: true
  validate:
    not_null: [atto_id, firmatario_uri, ruolo]
    # una riga = un firmatario di un atto (ruolo qualificato)
    primary_key: [atto_id, firmatario_uri, ruolo]
    # Leg15 ~15k atti × ~5,6 firmatari (83k righe)
    min_rows: 10000

mart:
  tables:
    - name: "mart_firmatari_per_atto"
      sql: "sql/mart_firmatari_per_atto.sql"
    - name: "mart_per_deputato"
      sql: "sql/mart_per_deputato.sql"
  required_tables:
    - "mart_firmatari_per_atto"
    - "mart_per_deputato"
  validate:
    table_rules:
      mart_firmatari_per_atto:
        required_columns: [atto_id, n_firmatari, n_primo, n_altro]
        primary_key: [atto_id]
        min_rows: 1000
      mart_per_deputato:
        required_columns: [persona_id, legislatura, n_firmate]
        min_rows: 10

validation:
  fail_on_error: true
