root: "../../out"
schema_version: 1

dataset:
  name: "dait_amministratori_locali"
  source_id: "dait"
  tags: [politica, dait, amministratori, locali]
  category: politica
  years: [2026]
  time_coverage: {start_year: 2026, end_year: 2026}

# --- RAW LAYER ---
# 3 source multi-livello (comune/provincia/regione) della stessa pagina DAIT.
# inject_column inietta livello_ente in ogni riga; il toolkit unisce i CSV
# con union_by_name (colonne mancanti → NULL). Nessun columns: esplicito
# in clean.read — disattiverebbe union_by_name.
raw:
  output_policy: overwrite
  sources:
    - name: "dait_ammcom"
      type: "http_file"
      args:
        url: "https://dait.interno.gov.it/documenti/ammcom.csv"
        filename: "ammcom.csv"
      inject_column:
        livello_ente: "comune"
      primary: true
    - name: "dait_ammprov"
      type: "http_file"
      args:
        url: "https://dait.interno.gov.it/documenti/ammprov.csv"
        filename: "ammprov.csv"
      inject_column:
        livello_ente: "provincia"
    - name: "dait_ammreg"
      type: "http_file"
      args:
        url: "https://dait.interno.gov.it/documenti/ammreg.csv"
        filename: "ammreg.csv"
      inject_column:
        livello_ente: "regione"

# --- CLEAN LAYER ---
# Le prime 2 righe di ogni CSV contengono metadati (titolo + data aggiornamento) — skip:2
# union_by_name gestisce le differenze di schema tra livelli (colonne mancanti → NULL).
# Date in formato DD/MM/YYYY parsate da DuckDB via dateformat.
clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: all
    delim: ";"
    encoding: "utf-8"
    header: true
    skip: 2
    parallel: false
    ignore_errors: true
    null_padding: true
    dateformat: "%d/%m/%Y"
  required_columns: [anno, livello_ente, codice_regione, codice_provincia, codice_comune, codice_dait_completo, denominazione_ente, sigla_provincia, popolazione_censita, cognome, nome, sesso, data_nascita, luogo_nascita, descrizione_carica, incarico, data_elezione, data_entrata_in_carica, data_elezione_max_carica, lista_appartenenza, titolo_studio, professione]
  validate:
    not_null: [anno, livello_ente, descrizione_carica]
    min_rows: 125000

# --- MART LAYER ---
# Mart analitiche:
#   1) mart_profilo_carica — conteggi, eta media, % femmine per carica (solo comuni)
#   2) mart_profilo_demografico — distribuzione sesso x classe di eta per carica (solo comuni)
#   3) mart_territorio — composizione per regione x carica (solo comuni)
#   4) mart_profilo_livello — confronto profilo tra comuni/province/regioni
mart:
  tables:
    - name: "mart_profilo_carica"
      sql: "sql/mart_profilo_carica.sql"
    - name: "mart_profilo_demografico"
      sql: "sql/mart_profilo_demografico.sql"
    - name: "mart_territorio"
      sql: "sql/mart_territorio.sql"
    - name: "mart_profilo_livello"
      sql: "sql/mart_profilo_livello.sql"
  required_tables:
    - "mart_profilo_carica"
    - "mart_territorio"
    - "mart_profilo_livello"
  validate:
    table_rules:
      mart_profilo_carica:
        required_columns: [descrizione_carica, n_amministratori, n_comuni, eta_media, quota_femmine_pct]
        primary_key: [descrizione_carica]
        min_rows: 5
      mart_profilo_demografico:
        required_columns: [descrizione_carica, sesso, n_amministratori, eta_media]
        primary_key: [descrizione_carica, sesso]
        min_rows: 5
      mart_territorio:
        required_columns: [codice_regione, descrizione_carica, n_amministratori, quota_femmine_pct]
        primary_key: [codice_regione, descrizione_carica]
        min_rows: 20
      mart_profilo_livello:
        required_columns: [livello_ente, descrizione_carica, n_amministratori, n_enti, eta_media, quota_femmine_pct]
        primary_key: [livello_ente, descrizione_carica]
        min_rows: 10

validation:
  fail_on_error: true
