# Destinatari degli atti di indirizzo e controllo della Camera (Leg13–19)
#
# Fonte: dati.camera.it SPARQL, classe ocd:aic.
# Una riga = (atto, organo di governo destinatario). Un atto può indirizzarsi
# a più ministri: il grano è atto × destinatario.
# Join: atto_id → camera_sindisp.atto_id; organo_id → organi di governo.

root: "../../out"
schema_version: 1

dataset:
  name: "camera_sindisp_destinatari"
  source_id: "dati_camera"
  tags: [politica, camera, sindacato-ispettivo, governo, ministri, accountability]
  category: politica
  years: [13, 14, 15, 16, 17, 18, 19]
  time_coverage:
    start_year: 1996
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    # Script per la stessa ragione del dataset principale: keyset manuale.
    - name: "camera_sindisp_destinatari_raw"
      type: "script"
      primary: true
      client:
        timeout: 1800
      args:
        command: "python ../../scripts/extract_camera_sindisp.py --legislature {year} --mode destinatari --out camera_sindisp_destinatari_raw.parquet"
        output: "camera_sindisp_destinatari_raw.parquet"
        filename: "camera_sindisp_destinatari_raw.parquet"

clean:
  sql: "sql/clean.sql"
  read_mode: robust
  required_columns: [atto_id, destinatario_uri, organo_id, legislatura]
  read:
    source: auto
    mode: latest
    header: true
    encoding: "utf-8"
    strict_mode: false
    ignore_errors: true
    trim_whitespace: true
  validate:
    not_null: [atto_id, destinatario_uri]
    # una riga = un destinatario di un atto
    primary_key: [atto_id, destinatario_uri]
    # Leg15 ~15k atti × 82% (14,5k righe)
    min_rows: 1000

mart:
  tables:
    - name: "mart_per_ministro"
      sql: "sql/mart_per_ministro.sql"
  required_tables:
    - "mart_per_ministro"
  validate:
    table_rules:
      mart_per_ministro:
        required_columns: [organo_id, destinatario_label, legislatura, n_atti, n_con_risposta]
        min_rows: 1

validation:
  fail_on_error: true
