# Voti individuali dei Senatori (XIX legislatura) — endpoint SPARQL dati.senato.it
root: "../../out"
schema_version: 1

dataset:
  name: "senato_votazioni"
  source_id: "dati_senato"
  tags: [politica, senato, votazioni, voti, accountability]
  category: politica
  years: [2026]
  time_coverage:
    # XIX legislatura — copertura reale del graph votazioni/19
    start_year: 2022
    end_year: 2026

raw:
  output_policy: overwrite
  sources:
    # parquet long-format prodotto da scripts/extract_senato_votazioni.py
    - name: "senato_votazioni_parquet"
      type: "local_file"
      primary: true
      args:
        path: "../../out/data/derived/senato_votazioni/senato_votazioni.parquet"
        filename: "senato_votazioni.parquet"

clean:
  sql: "sql/clean.sql"
  read:
    source: auto
    mode: latest
  required_columns: [votazione, votazione_id, senatore_id, voto, data]
  validate:
    not_null: [senatore_id, voto]
    # una riga = voto di un senatore su una votazione
    primary_key: [votazione, senatore_id]
    min_rows: 500000

mart:
  tables:
    - name: "mart_sintesi"
      sql: "sql/mart_sintesi.sql"
    - name: "mart_voto_senatore"
      sql: "sql/mart_voto_senatore.sql"
  required_tables:
    - "mart_sintesi"
    - "mart_voto_senatore"
  validate:
    table_rules:
      mart_sintesi:
        required_columns: [anno, n_votazioni, media_votanti]
        primary_key: [anno]
        min_rows: 1
      mart_voto_senatore:
        required_columns: [senatore_id, n_voti, n_favorevoli, n_contrari]
        primary_key: [senatore_id]
        min_rows: 100

validation:
  fail_on_error: true
