# Pipeline — open-politica
#
# Post-merge + refresh. Usa pipeline-reusable.yml dell'org.
# Su PR merged: solo i dataset toccati (detect + batch).
# Su schedule: tutti i dataset.
# Su dispatch: uno o più dataset (slug o path, separati da virgola) se
# `datasets` è valorizzato, altrimenti tutti. Il dispatch salta il detect e
# sincronizza su GCS. Convenzione: ADR-002.

name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "compose/**"
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:
    inputs:
      datasets:
        description: "Uno o più slug separati da virgola (o path del dataset.yml). Vuoto = tutti. Vedi ADR-002."
        required: false
        default: ""

concurrency:
  group: open-politica-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "open-politica"
      run-command: >-
        ${{ inputs.datasets == '' && 'make run-all' || format('for d in $(echo "{0}" | tr "," " "); do toolkit run --config "$d"; done', inputs.datasets) }}
      run-batch-command: "make run-batch"
      detect-paths: "datasets compose"
      extra-env: TOOLKIT_ALLOW_SCRIPT_SOURCE=1
      sync-pattern: "per-dataset"
    secrets: inherit
