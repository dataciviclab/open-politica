# Pipeline — open-politica
#
# Orchestratore sottile (ADR-001: la logica non vive in YAML). Trigger:
# schedule mensile + dispatch manuale. Ogni config (dataset o compose) gira
# con `toolkit run` full: i compose dichiarano raw.sources (i loro input) e
# il toolkit materializza i support una volta (skip-if-exists).
#
# Flusso:
#   1. estrazioni pesanti (senato_votazioni, camera_voti) via script
#   2. run dei dataset (datasets/ poi compose/)
#   3. ponte persona (legge i clean di camera_deputati/senato_anagrafica)
#   4. sync GCS (clean + mart) con prefisso open-politica/ — GRACEFUL
#   5. toolkit registry build --write → PR draft se diff

name: Pipeline
on:
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

concurrency:
  group: open-politica-pipeline-${{ github.ref || 'schedule' }}
  cancel-in-progress: false

env:
  TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"

jobs:
  pipeline:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: |
          pip install git+https://github.com/dataciviclab/toolkit.git@main
          pip install git+https://github.com/dataciviclab/lab-connectors.git
          pip install -r requirements.txt

      # ── Estrazioni pesanti (Senato e Camera in parallelo: WAF indipendenti) ──
      - name: Extract heavy sources
        run: |
          python3 scripts/extract_senato_votazioni.py --legislature 19 --incremental &
          SEN=$!
          python3 scripts/extract_camera_voti.py --legislature 19 --batch 200 --incremental &
          CAM=$!
          wait $SEN
          wait $CAM

      # ── Run pipeline: dataset → ponte → compose (ordine per dipendenze) ──
      - name: Run datasets
        run: |
          for f in datasets/*/dataset.yml; do
            case "$f" in datasets/ponte-persona/*) continue ;; esac
            echo "=== $f ==="
            toolkit run -c "$f"
          done

      - name: Build ponte persona
        run: |
          python3 scripts/build_ponte_persona.py
          toolkit run -c datasets/ponte-persona/dataset.yml

      - name: Run compose
        run: |
          for f in compose/*/dataset.yml; do
            echo "=== $f ==="
            toolkit run -c "$f"
          done

      # ── Sync GCS (clean + mart) con prefisso open-politica/ ─────────
      - name: Auth GCP
        id: gcs
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY_OPEN_POLITICA }}
        run: |
          if [ -z "$GCP_SA_KEY" ]; then
            echo "⚠️ GCP_SA_KEY_OPEN_POLITICA non configurata — skip GCS sync"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if echo "$GCP_SA_KEY" | python3 -c "import json,sys; json.load(sys.stdin)" 2>/dev/null; then
            printf '%s\n' "$GCP_SA_KEY" > /tmp/gcp-key.json
          else
            printf '%s\n' "$GCP_SA_KEY" | base64 -d > /tmp/gcp-key.json 2>/dev/null
          fi
          gcloud auth activate-service-account --key-file=/tmp/gcp-key.json
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: Sync to GCS
        if: steps.gcs.outputs.ready == 'true'
        run: |
          # Pattern rna + gestione layout eterogenei:
          # - dir anni → $slug/$year/
          # - file parquet flat (es. mart multi-anno) → $slug/
          # Esclusi _run/_validate/metadata (solo parquet pubblici).
          sync_layer() {
            local layer="$1" bucket="$2"
            for slug_dir in $ALL_DIRS; do
              slug=$(grep '^  name:' "$slug_dir/dataset.yml" | sed 's/.*: "//;s/"//')
              base="out/data/$layer/$slug"
              [ -d "$base" ] || continue
              for year in $(find "$base" -maxdepth 1 -mindepth 1 -type d -printf '%f\n' 2>/dev/null | grep -vE '^_' | sort -rn); do
                gsutil -m rsync -r -x ".*/_(run|validate)/.*|.*/metadata\.json$" \
                  "$base/$year/" "$bucket/open-politica/$slug/$year/"
                echo "✅ $slug/$year $layer synced"
              done
              for f in $(find "$base" -maxdepth 1 -type f -name '*.parquet' 2>/dev/null); do
                gsutil -m cp "$f" "$bucket/open-politica/$slug/$(basename "$f")"
                echo "✅ $slug/$(basename "$f") $layer synced"
              done
            done
          }
          ALL_DIRS="datasets/* compose/*"
          sync_layer clean gs://dataciviclab-clean
          sync_layer mart gs://dataciviclab-mart

      # ── Registry (artifact catalogo) ────────────────────────────────────
      - name: Build registry
        run: toolkit registry build --write

      - name: Check registry diff
        id: diff
        run: |
          if git status --porcelain -- registry/ | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create draft registry PR
        if: steps.diff.outputs.changed == 'true'
        run: |
          BRANCH="post-merge-registry/${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add registry/
          git commit -m "chore(post-merge): aggiorna registry" || exit 0
          git push --force-with-lease -u origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

      - name: Create/update draft registry PR
        if: steps.diff.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const branch = `post-merge-registry/${context.runId}`;
            const { repo, owner } = context.repo;
            const existing = await github.rest.pulls.list({ owner, repo, head: branch, state: 'open' });
            const params = { owner, repo, title: 'chore(post-merge): aggiorna registry',
              body: 'Registry artifacts updated after pipeline run.', head: branch, base: 'main' };
            if (existing.data.length > 0) {
              await github.rest.pulls.update({ owner, repo, pull_number: existing.data[0].number,
                title: params.title, body: params.body });
            } else {
              params.draft = true;
              await github.rest.pulls.create(params);
            }
