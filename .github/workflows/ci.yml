# CI — open-politica
# Validazione leggera su PR/push: config dataset validi via toolkit preflight.
# Il run completo (estrazioni + pipeline) avviene in pipeline.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-config:
    uses: dataciviclab/.github/.github/workflows/dataset-config-check-reusable.yml@main
    with:
      install: "pip install -r requirements.txt"
      globs: "datasets compose"
      years: "from-config"
