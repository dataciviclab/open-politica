# CI — open-politica
# Validazione leggera su PR/push: config dataset validi via toolkit preflight.
# Il run completo (estrazioni + pipeline) avviene in pipeline.yml.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install toolkit
        run: pip install git+https://github.com/dataciviclab/toolkit.git@main

      - name: Validate all dataset configs (preflight)
        env:
          TOOLKIT_ALLOW_SCRIPT_SOURCE: "1"
        run: |
          for cfg in $(find datasets compose -name dataset.yml | sort); do
            echo "→ $cfg"
            toolkit run preflight --config "$cfg" > /dev/null
          done
          echo "✅ All configs valid"
